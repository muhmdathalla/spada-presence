name: SPADA UPNYK Auto Presence

on:
  # Penjadwalan cerdas: Jam perkuliahan spesifik (WIB = UTC + 7)
  # Menggunakan dual-check per jadwal dan menit ganjil agar tidak di-drop oleh GitHub Actions scheduler
  schedule:
    # SENIN (Monday = 1)
    - cron: '2 3 * * 1'    # 10:02 WIB - Sistem Operasi (Check 1)
    - cron: '12 3 * * 1'   # 10:12 WIB - Sistem Operasi (Check 2)
    - cron: '2 6 * * 1'    # 13:02 WIB - Praktikum Data Science (Check 1)
    - cron: '7 6 * * 1'    # 13:07 WIB - Praktikum Data Science (Check 2)
    - cron: '52 7 * * 1'   # 14:52 WIB - Administrasi Server (Check 1)
    - cron: '2 8 * * 1'    # 15:02 WIB - Administrasi Server (Check 2)

    # SELASA (Tuesday = 2)
    - cron: '2 0 * * 2'    # 07:02 WIB - Internet of Things (IoT) (Check 1)
    - cron: '12 0 * * 2'   # 07:12 WIB - Internet of Things (IoT) (Check 2)
    - cron: '2 3 * * 2'    # 10:02 WIB - Manajemen Proyek Perangkat Lunak (Check 1)
    - cron: '12 3 * * 2'   # 10:12 WIB - Manajemen Proyek Perangkat Lunak (Check 2)
    - cron: '2 6 * * 2'    # 13:02 WIB - Praktikum IoT (Check 1)
    - cron: '7 6 * * 2'    # 13:07 WIB - Praktikum IoT (Check 2)

    # KAMIS (Thursday = 4)
    - cron: '27 0 * * 4'   # 07:27 WIB - Kriptografi (Check 1)
    - cron: '33 0 * * 4'   # 07:33 WIB - Kriptografi (Check 2)
    - cron: '32 5 * * 4'   # 12:32 WIB - Data Science (Check 1)
    - cron: '38 5 * * 4'   # 12:38 WIB - Data Science (Check 2)

    # JUMAT (Friday = 5)
    - cron: '2 6 * * 5'    # 13:02 WIB - Pengolahan Citra (Check 1)
    - cron: '12 6 * * 5'   # 13:12 WIB - Pengolahan Citra (Check 2)
    - cron: '32 8 * * 5'   # 15:32 WIB - Penginderaan Jarak Jauh (Check 1)
    - cron: '42 8 * * 5'   # 15:42 WIB - Penginderaan Jarak Jauh (Check 2)

    # SABTU (Saturday = 6)
    - cron: '2 0 * * 6'    # 07:02 WIB - Kapita Selekta (Check 1)
    - cron: '12 0 * * 6'   # 07:12 WIB - Kapita Selekta (Check 2)

  # Remote Webhook Trigger (cron-job.org / curl / external scheduler)
  repository_dispatch:
    types: [auto-presence, run-presence]

  # Trigger Manual lewat menu GitHub Actions (Kapan saja)
  workflow_dispatch:
    inputs:
      course:
        description: 'Pilih Matkul (atau pilih auto)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - all
          - sistem-operasi
          - praktikum-data-science
          - administrasi-server
          - iot
          - mppl
          - praktikum-iot
          - kriptografi
          - data-science
          - pengolahan-citra
          - penginderaan-jarak-jauh
          - kapita-selekta
      token:
        description: 'Password / Token Presensi dari Dosen (jika ada)'
        required: false
        default: ''
        type: string

# Mencegah duplikasi run jika ada trigger beruntun
concurrency:
  group: presence-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run-attendance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Execute Attendance
        env:
          SPADA_USERNAME: ${{ secrets.SPADA_USERNAME }}
          SPADA_PASSWORD: ${{ secrets.SPADA_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIMEZONE: "Asia/Jakarta"
          HEADLESS: "true"
        run: |
          COURSE_INPUT="${{ github.event.inputs.course }}"
          TOKEN_INPUT="${{ github.event.inputs.token }}"

          CMD_ARGS=""
          if [ -z "$COURSE_INPUT" ] || [ "$COURSE_INPUT" = "auto" ]; then
            CMD_ARGS="--auto"
          elif [ "$COURSE_INPUT" = "all" ]; then
            CMD_ARGS="--all"
          else
            CMD_ARGS="--course $COURSE_INPUT"
          fi

          if [ -n "$TOKEN_INPUT" ]; then
            CMD_ARGS="$CMD_ARGS --token $TOKEN_INPUT"
          fi

          echo "Menjalankan presensi dengan argumen: $CMD_ARGS"
          python main.py $CMD_ARGS

      - name: Upload Screenshot Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attendance-screenshots
          path: screenshots/*.png
          retention-days: 3
