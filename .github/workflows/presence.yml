name: SPADA UPNYK Auto Presence

on:
  # Penjadwalan cerdas: Cek otomatis setiap 10 menit selama jam perkuliahan berlangsung (WIB = UTC + 7)
  schedule:
    # SENIN: Rentang 10:00 - 15:40 WIB (03:00 - 08:40 UTC)
    - cron: '*/10 3-8 * * 1'

    # SELASA: Rentang 07:00 - 13:30 WIB (00:00 - 06:30 UTC)
    - cron: '*/10 0-6 * * 2'

    # KAMIS: Rentang 07:20 - 13:00 WIB (00:20 - 06:00 UTC)
    - cron: '*/10 0-6 * * 4'

    # JUMAT: Rentang 13:00 - 18:00 WIB (06:00 - 11:00 UTC)
    - cron: '*/10 6-11 * * 5'

    # SABTU: Rentang 07:00 - 09:10 WIB (00:00 - 02:10 UTC)
    - cron: '*/10 0-2 * * 6'

  # Trigger Manual lewat menu GitHub Actions (Kapan saja)
  workflow_dispatch:
    inputs:
      course:
        description: 'Pilih Matkul (atau pilih auto)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - all
          - sistem-operasi
          - praktikum-data-science
          - administrasi-server
          - iot
          - mppl
          - praktikum-iot
          - kriptografi
          - data-science
          - pengolahan-citra
          - penginderaan-jarak-jauh
          - kapita-selekta
      token:
        description: 'Password / Token Presensi dari Dosen (jika ada)'
        required: false
        default: ''
        type: string

# Mencegah duplikasi run jika ada trigger beruntun
concurrency:
  group: presence-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run-attendance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Execute Attendance
        env:
          SPADA_USERNAME: ${{ secrets.SPADA_USERNAME }}
          SPADA_PASSWORD: ${{ secrets.SPADA_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIMEZONE: "Asia/Jakarta"
          HEADLESS: "true"
        run: |
          COURSE_INPUT="${{ github.event.inputs.course }}"
          TOKEN_INPUT="${{ github.event.inputs.token }}"

          CMD_ARGS=""
          if [ -z "$COURSE_INPUT" ] || [ "$COURSE_INPUT" = "auto" ]; then
            CMD_ARGS="--auto"
          elif [ "$COURSE_INPUT" = "all" ]; then
            CMD_ARGS="--all"
          else
            CMD_ARGS="--course $COURSE_INPUT"
          fi

          if [ -n "$TOKEN_INPUT" ]; then
            CMD_ARGS="$CMD_ARGS --token $TOKEN_INPUT"
          fi

          echo "Menjalankan presensi dengan argumen: $CMD_ARGS"
          python main.py $CMD_ARGS

      - name: Upload Screenshot Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attendance-screenshots
          path: screenshots/*.png
          retention-days: 3
